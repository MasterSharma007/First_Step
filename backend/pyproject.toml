[project]
name = "banknifty-backend"
version = "0.1.0"
description = "AI-Based Bank Nifty Intraday Trading Platform - backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "aio-pika>=9.5",
    "kiteconnect>=5.0",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "structlog>=24.4",
    "APScheduler>=3.10",
]

[project.scripts]
backfill = "app.cli.backfill:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default-argument is the intended pattern, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
